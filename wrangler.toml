name = "zhink"
main = "src/worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/index.html",
  "/api",
  "/api/*",
  "/s",
  "/s/*",
  "/authorize",
  "/authorize/*",
  "/oauth/*",
  "/mcp",
  "/mcp/*",
  "/.well-known/*",
]

[[d1_databases]]
binding = "DB"
database_name = "inkstone-db"
database_id = "7945c943-d1b8-4bb9-85fd-83ae7686e4f1"

[[r2_buckets]]
binding = "FILES"
bucket_name = "inkstone-files"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "704de91207164c239000ee3b92f0929b"

[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "SyncHub"

[[durable_objects.bindings]]
name = "CREDENTIAL_VAULT"
class_name = "CredentialVault"

[exports.SyncHub]
type = "durable-object"
storage = "sqlite"

[exports.CredentialVault]
type = "durable-object"
storage = "sqlite"

[ai]
binding = "AI"

[triggers]
crons = ["0 * * * *", "15,45 * * * *"]

[vars]
APP_NAME = "Inkstone"
# The owner account is defined entirely by Cloudflare secrets, which are the source
# of truth: on every cold start the Worker reconciles the account against them
# (see src/worker/db/schema.ts → syncConfiguredOwner). Set BOTH with
# `npx wrangler secret put <name>` or the Cloudflare Dashboard →
# Workers → zhink → Settings → Variables and Secrets → Secrets.
#   ADMINISTRATOR  username of the owner account (created on an empty instance,
#                  otherwise it must already exist)
#   ADMINPASSWORD  password for that account; rotating it replaces the stored hash
#                  and signs the account out of every device
# Never declare either one here as a plain-text var.

[observability]
enabled = true
