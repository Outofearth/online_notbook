name = "zhink"
main = "src/worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/index.html",
  "/api",
  "/api/*",
  "/s",
  "/s/*",
  "/authorize",
  "/authorize/*",
  "/oauth/*",
  "/mcp",
  "/mcp/*",
  "/.well-known/*",
]

[[d1_databases]]
binding = "DB"
database_name = "inkstone-db"
database_id = "7945c943-d1b8-4bb9-85fd-83ae7686e4f1"

[[r2_buckets]]
binding = "FILES"
bucket_name = "inkstone-files"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "704de91207164c239000ee3b92f0929b"

[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "SyncHub"

[[durable_objects.bindings]]
name = "CREDENTIAL_VAULT"
class_name = "CredentialVault"

[exports.SyncHub]
type = "durable-object"
storage = "sqlite"

[exports.CredentialVault]
type = "durable-object"
storage = "sqlite"

[ai]
binding = "AI"

[triggers]
crons = ["0 * * * *", "15,45 * * * *"]

[vars]
APP_NAME = "Inkstone"
# Owner account seeded on first boot — see src/worker/db/schema.ts → seedConfiguredAdmin.
# The username is not sensitive, so it belongs here as a plain variable rather than a
# Secret. A config-based deploy replaces the Worker's plain variables wholesale, so a
# Dashboard-only plain variable would silently disappear on the next deploy; keeping it
# in this file makes it survive.
ADMINISTRATOR = "admin"
# NOTE: ADMINPASSWORD MUST be set as an encrypted Secret, never as a plain-text var.
# Use `npx wrangler secret put ADMINPASSWORD` or the Cloudflare Dashboard →
# Workers → zhink → Settings → Variables and Secrets → Secrets.

[observability]
enabled = true
